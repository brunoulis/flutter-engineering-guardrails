# Example to copy to <your-project>/.flutter-rails.yaml
# Declarative contract read by the agent. Only the optional `rules:` section at
# the end is also enforced by tool/bin/flutter_rails_audit.dart (as heuristic leads).
# Illustrative Flutter values: replace with the actual repository.
# The historical filename also supports Dart-only packages. For those, omit ui,
# routing and state-framework settings; do not add Flutter to match this example.
version: 1
project:
  name: "my_flutter_project"
  kind: "flutter_app" # or dart_library, dart_cli, dart_service, mixed_workspace
  platforms: [web, windows]
  min_sdk_source: "pubspec.yaml" # Do not invent versions; read the file.
  resolution_source: "detect_package_or_workspace_root"
  runtime_targets: ["detect_existing"] # VM/AOT/browser JS/Wasm as applicable
  code_owner: "existing_team"
architecture:
  preferred_state: "provider_change_notifier_viewmodel"
  routing: "detect_existing"  # e.g. go_router / Navigator / GetX
  layout: "existing_feature_structure"
  dependency_injection: "existing_provider_constructors"
  allow_new_architecture_only_with_evidence: true
  repository_layer: "when_data_boundary_needs_it"
  domain_use_cases: "optional_not_default"
  separate_packages: "analyze_before_separating"
ui:
  responsive_breakpoint_px: 980 # EXAMPLE of an already-existing breakpoint, NOT a general value.
  breakpoint_policy: "preserve_existing_until_ui_spec_changes"
  tokens: "follow_existing_theme"
  accessibility: true
  supported_input: [mouse, keyboard]
quality:
  preserve_public_contracts: true
  prohibit_silent_behavior_changes: true
  no_new_dependencies_without_approval: true
  avoid_repo_wide_auto_fixes: true
  lint_policy: "honor_analysis_options"
  refactor_mode_default: "incremental"
  add_characterization_tests_before_risky_refactor: true
verification:
  format: true
  analyze: true
  tests: "targeted_then_expand_by_risk"
  browser_integration: "run_when_available"
  report_unverified_as_unverified: true
# Optional, checked by the audit tool (syntax only, name-based). Adapt or delete.
rules:
  viewmodel-base-class:        # classes named *ViewModel must extend BaseViewModel
    paths: [lib]
    class-suffix: ViewModel
    must-extend: BaseViewModel
    exclude: [BaseViewModel]   # the base classes themselves
  forbidden-imports:
    - paths: [lib/**/presentation]
      imports: ["package:http", "package:dio"]
  forbidden-types:             # no BuildContext inside viewmodels
    - class-suffix: ViewModel
      types: [BuildContext]
